<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERZ-com Vertragsrechner</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        :root {
            --primary-color: #0b2d54;
            --secondary-color: #71be16;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .app-container { background: var(--card-bg); width: 100%; max-width: 450px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid var(--border-color); }
        .header { background: var(--primary-color); color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--secondary-color); }
        .header h1 { font-size: 1.3rem; margin-bottom: 4px; }
        .header p { font-size: 0.85rem; opacity: 0.9; }
        .tabs { display: flex; background: #edf2f7; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-size: 0.9rem; font-weight: bold; color: #64748b; cursor: pointer; text-align: center; }
        .tab-btn.active { color: var(--primary-color); background: white; border-bottom: 3px solid var(--primary-color); }
        .content { padding: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; color: #475569; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper input, .input-wrapper select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; outline: none; background: white; -webkit-appearance: none; appearance: none; }
        .input-wrapper::after { content: "€"; position: absolute; right: 12px; color: #94a3b8; font-weight: bold; pointer-events: none; }
        .input-wrapper.select-wrapper::after { content: "▼"; color: #64748b; font-size: 0.8rem; right: 14px; }
        .btn-calc { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .result-box { margin-top: 15px; padding: 12px; background: #f8fafc; border-left: 4px solid var(--secondary-color); border-radius: 4px; display: none; }
        .result-box h3 { font-size: 0.8rem; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .result-box .main-value { font-size: 1.4rem; font-weight: bold; color: var(--primary-color); }
        .result-box .sub-value { font-size: 0.8rem; color: #64748b; margin-top: 2px; }
        .alert-box { margin-top: 10px; padding: 8px; background: #fffbeb; border-left: 4px solid #f59e0b; color: #b45309; border-radius: 4px; font-size: 0.8rem; display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>ERZ-com.net</h1>
        <p>Handyshops Olbernhau + Marienberg</p>
    </div>
    
    <div class="tabs">
        <button id="btn-marge" class="tab-btn active" onclick="switchTab('marge')">Marge berechnen</button>
        <button id="btn-preis" class="tab-btn" onclick="switchTab('preis')">Preis kalkulieren</button>
    </div>

    <div class="content">
        <!-- TAB 1: MARGE -->
        <div id="tab-marge" class="tab-content active">
            <div class="input-group"><label>Brutto-Verkaufspreis (vom Kunden)</label><div class="input-wrapper"><input type="number" step="0.01" id="m-brutto-vk"></div></div>
            <div class="input-group"><label>Einkaufspreis / Warenkosten (netto)</label><div class="input-wrapper"><input type="number" step="0.01" id="m-netto-ek"></div></div>
            <div class="input-group"><label>Provision (erhalten, netto)</label><div class="input-wrapper"><input type="number" step="0.01" id="m-provision"></div></div>
            <div class="input-group">
                <label>NBA (netto)</label>
                <div class="input-wrapper select-wrapper">
                    <select id="m-nba">
                        <option value="0">kein</option>
                        <option value="40">40 €</option>
                        <option value="80">80 €</option>
                    </select>
                </div>
            </div>
            <button class="btn-calc" onclick="kalkuliereMarge()">Gewinn berechnen</button>
            <div id="res-marge" class="result-box">
                <h3>Ihr Nettogewinn (Gesamtmarge)</h3>
                <div class="main-value" id="val-marge-gewinn">0,00 €</div>
                <div class="sub-value" id="val-marge-netto-vk">Netto-VK: 0,00 €</div>
            </div>
        </div>

        <!-- TAB 2: PREIS -->
        <div id="tab-preis" class="tab-content">
            <div class="input-group"><label>Einkaufspreis / Warenkosten (netto)</label><div class="input-wrapper"><input type="number" step="0.01" id="p-netto-ek"></div></div>
            <div class="input-group"><label>Provision (erhalten, netto)</label><div class="input-wrapper"><input type="number" step="0.01" id="p-provision"></div></div>
            <div class="input-group">
                <label>NBA (netto)</label>
                <div class="input-wrapper select-wrapper">
                    <select id="p-nba">
                        <option value="0">kein</option>
                        <option value="40">40 €</option>
                        <option value="80">80 €</option>
                    </select>
                </div>
            </div>
            <div class="input-group"><label>Gewünschter Ziel-Nettogewinn (Mindestmarge)</label><div class="input-wrapper"><input type="number" step="0.01" id="p-ziel-gewinn"></div></div>
            <button class="btn-calc" onclick="kalkulierePreis()">Verkaufspreis ermitteln</button>
            <div id="alert-preis" class="alert-box">🚨 Hinweis: Provision & NBA decken die Kosten. Mindestpreis angewendet.</div>
            <div id="res-preis" class="result-box">
                <h3>Erforderlicher Brutto-Verkaufspreis</h3>
                <div class="main-value" id="val-preis-brutto">0,00 €</div>
                <div class="sub-value" id="val-preis-netto">Erforderlicher Netto-VK: 0,00 €</div>
            </div>
        </div>
    </div>
</div>

<script>
    const MWST_SATZ = 19.0;
    const MIN_BRUTTO_VK = 1.00;
    const MARKETING_ENDING = 0.90;

    function bruttoZuNetto(brutto) { return brutto / (1 + (MWST_SATZ / 100)); }
    function nettoZuBrutto(netto) { return netto * (1 + (MWST_SATZ / 100)); }
    
    function holeWert(id) { 
        const el = document.getElementById(id);
        return el ? (parseFloat(el.value) || 0) : 0; 
    }
    
    function formatEuro(wert) { return wert.toFixed(2).replace('.', ',') + " €"; }

    function rundeAufX990(preis) {
        if (preis <= 0) return MIN_BRUTTO_VK;
        let naechsterZehner = Math.ceil(preis / 10.0) * 10.0;
        let preisX990 = naechsterZehner - (1.00 - MARKETING_ENDING);
        if (preisX990 < preis) { preisX990 = (naechsterZehner + 10.0) - (1.00 - MARKETING_ENDING); }
        return preisX990;
    }

    function switchTab(mode) {
        const btnMarge = document.getElementById('btn-marge');
        const btnPreis = document.getElementById('btn-preis');
        const tabMarge = document.getElementById('tab-marge');
        const tabPreis = document.getElementById('tab-preis');

        if (!btnMarge || !btnPreis || !tabMarge || !tabPreis) return;

        if (mode === 'marge') {
            btnMarge.className = 'tab-btn active';
            btnPreis.className = 'tab-btn';
            tabMarge.className = 'tab-content active';
            tabPreis.className = 'tab-content';
        } else {
            btnMarge.className = 'tab-btn';
            btnPreis.className = 'tab-btn active';
            tabMarge.className = 'tab-content';
            tabPreis.className = 'tab-content active';
        }
    }

    function kalkuliereMarge() {
        let bruttoVk = holeWert('m-brutto-vk');
        let nettoEk = holeWert('m-netto-ek');
        let provision = holeWert('m-provision');
        let nba = holeWert('m-nba');
        let nettoVk = bruttoZuNetto(bruttoVk);
        let gewinn = (nettoVk + provision + nba) - nettoEk;
        
        const resBox = document.getElementById('res-marge');
        if (resBox) {
            document.getElementById('val-marge-gewinn').innerText = formatEuro(gewinn);
            document.getElementById('val-marge-netto-vk').innerText = "Netto-VK: " + formatEuro(nettoVk);
            resBox.style.display = 'block';
        }
    }

    function kalkulierePreis() {
        let nettoEk = holeWert('p-netto-ek');
        let provision = holeWert('p-provision');
        let nba = holeWert('p-nba');
        let zielGewinn = holeWert('p-ziel-gewinn');
        let erfNettoVkIdeal = (nettoEk + zielGewinn) - provision - nba;
        let minNettoVk = bruttoZuNetto(MIN_BRUTTO_VK);
        let bruttoFinal = 0;
        
        const alertBox = document.getElementById('alert-preis');
        const resBox = document.getElementById('res-preis');

        if (erfNettoVkIdeal <= minNettoVk) {
            bruttoFinal = MIN_BRUTTO_VK;
            if (alertBox) alertBox.style.display = 'block';
        } else {
            bruttoFinal = rundeAufX990(nettoZuBrutto(erfNettoVkIdeal));
            if (alertBox) alertBox.style.display = 'none';
        }
