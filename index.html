<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERZ-com Vertragsrechner</title>
    
    <!-- App-Icons -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        :root {
            --primary-color: #0b2d54; /* Firmen-Blau */
            --secondary-color: #71be16; /* Firmen-Grün */
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--secondary-color);
        }

        .header h1 {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #edf2f7;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: none;
            font-size: 0.95rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--primary-color);
            background: white;
            border-bottom: 3px solid var(--primary-color);
        }

        .content {
            padding: 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 35px 12px 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-color);
        }

        .input-wrapper::after {
            content: "€";
            position: absolute;
            right: 14px;
            color: #94a3b8;
            font-weight: bold;
        }

        .btn-calc {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-calc:hover {
            background: #113b6b;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #f8fafc;
            border-left: 4px solid var(--secondary-color);
            border-radius: 4px;
            display: none;
        }

        .result-box h3 {
            font-size: 0.9rem;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .result-box .main-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .result-box .sub-value {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 4px;
        }

        .alert-box {
            margin-top: 12px;
            padding: 10px 12px;
            background: #fffbeb;
            border: 1px solid #fef3c7;
            border-left: 4px solid #f59e0b;
            color: #b45309;
            border-radius: 4px;
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>ERZ-com.net</h1>
        <p>Handyshops Olbernhau + Marienberg</p>
    </div>
    
    <div class="tabs">
        <button id="btn-marge" class="tab-btn active" onclick="switchTab('marge')">Marge berechnen</button>
        <button id="btn-preis" class="tab-btn" onclick="switchTab('preis')">Preis kalkulieren</button>
    </div>

    <div class="content">
        <!-- TAB 1: GESAMTMÄRGE BERECHNEN -->
        <div id="tab-marge" class="tab-content active">
            <div class="input-group">
                <label>Brutto-Verkaufspreis (vom Kunden)</label>
                <div class="input-wrapper"><input type="number" step="0.01" id="m-brutto-vk" placeholder="0,00"></div>
            </div>
            <div class="input-group">
                <label>Einkaufspreis / Warenkosten (netto)</label>
                <div class="input-wrapper"><input type="number" step="0.01" id="m-netto-ek" placeholder="0,00"></div>
            </div>
            <div class="input-group">
                <label>Provision (erhalten, netto)</label>
                <div class="input-wrapper"><input type="number" step="0.01" id="m-provision" placeholder="0,00"></div>
            </div>
            <div class="input-group">
                <label>NBA (netto)</label>
                <div class="input-wrapper"><input type="number" step="0.01" id="m-nba" placeholder="0,00"></div>
            </div>
            <button class="btn-calc" onclick="kalkuliereMarge()">Gewinn berechnen</button>

            <div id="res-marge" class="result-box">
                <h3>Ihr Nettogewinn (Gesamtmarge)</h3>
                <div class="main-value" id="val-marge-gewinn">0,00 €</div>
                <div class="sub-value" id="val-marge-netto-vk">Netto-VK: 0,00 €</div>
            </div>
        </div>

        <!-- TAB 2: MINDESTMÄRGE ERRECHNEN -->
        <div id="tab-preis" class="tab-content">
            <div class="input-group">
                <label>Einkaufspreis / Warenkosten (netto)</label>
                <div class="input-wrapper"><input type="number" step="0.01" id="p-netto-ek" placeholder="0,00"></div>
            </div>
            <div class="input-group">
                <label>Provision (erhalten, netto)</label>
                <div class="input-wrapper"><input type="number" step="0.01" id="p-provision" placeholder="0,00"></div>
            </div>
            <div class="input-group">
                <label>NBA (netto)</label>
                <div class="input-wrapper"><input type="number" step="0.01" id="p-nba" placeholder="0,00"></div>
            </div>
            <div class="input-group">
                <label>Gewünschter Ziel-Nettogewinn (Mindestmarge)</label>
                <div class="input-wrapper"><input type="number" step="0.01" id="p-ziel-gewinn" placeholder="0,00"></div>
            </div>
            <button class="btn-calc" onclick="kalkulierePreis()">Verkaufspreis ermitteln</button>

            <div id="alert-preis" class="alert-box">
                🚨 Hinweis: Provision & NBA decken die Kosten voll ab. Mindest-Bruttopreis angewendet.
            </div>

            <div id="res-preis" class="result-box">
                <h3>Erforderlicher Brutto-Verkaufspreis</h3>
                <div class="main-value" id="val-preis-brutto">0,00 €</div>
                <div class="sub-value" id="val-preis-netto">Erforderlicher Netto-VK: 0,00 €</div>
            </div>
        </div>
    </div>
</div>

<script>
    const MWST_SATZ = 19.0;
    const MIN_BRUTTO_VK = 1.00;
    const MARKETING_ENDING = 0.90;

    function bruttoZuNetto(brutto) { return brutto / (1 + (MWST_SATZ / 100)); }
    function nettoZuBrutto(netto) { return netto * (1 + (MWST_SATZ / 100)); }
    function holeWert(id) { return parseFloat(document.getElementById(id).value) || 0; }
    function formatEuro(wert) { return wert.toFixed(2).replace('.', ',') + " €"; }

    function rundeAufX990(preis) {
        if (preis <= 0) return MIN_BRUTTO_VK;
        let naechsterZehner = Math.ceil(preis / 10.0) * 10.0;
        let preisX990 = naechsterZehner - (1.00 - MARKETING_ENDING);
        if (preisX990 < preis) {
            preisX990 = (naechsterZehner + 10.0) - (1.00 - MARKETING_ENDING);
        }
        return preisX990;
    }

    // Reparierte und absolut robuste Tab-Steuerung
    function switchTab(mode) {
        if (mode === 'marge') {
            document.getElementById('btn-marge').classList.add('active');
            document.getElementById('btn-preis').classList.remove('active');
            document.getElementById('tab-marge').classList.add('active');
            document.getElementById('tab-preis').classList.remove('active');
        } else {
            document.getElementById('btn-marge').classList.remove('active');
            document.getElementById('btn-preis').classList.add('active');
            document.getElementById('tab-marge').classList.remove('active');
