<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERZ-com Vertragsrechner</title>
        <!-- Verknüpfung für das hochgeladene App-Icon -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.jpg">
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <style>
        :root {
            --bg-dark: #070f1e;
            --card-bg: #0f1b2f;
            --accent-green: #71be16;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .app-container { background: var(--card-bg); width: 100%; max-width: 440px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid var(--border-color); padding: 24px; }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 1.6rem; font-weight: 800; color: #ffffff; }
        .header p { font-size: 0.85rem; color: var(--accent-green); margin-top: 4px; text-transform: uppercase; }
        
        .tab-radio { display: none; }
        .tabs-nav { display: flex; background: var(--bg-dark); padding: 6px; border-radius: 14px; margin-bottom: 24px; border: 1px solid var(--border-color); }
        .tab-label { flex: 1; padding: 12px; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); cursor: pointer; text-align: center; border-radius: 10px; }
        .tab-content { display: none; }
        
        #radio-marge:checked ~ .tabs-nav .label-marge { color: var(--text-main); background: var(--card-bg); }
        #radio-preis:checked ~ .tabs-nav .label-preis { color: var(--text-main); background: var(--card-bg); }
        #radio-marge:checked ~ .content-panes #tab-marge { display: block; }
        #radio-preis:checked ~ .content-panes #tab-preis { display: block; }

        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper input { width: 100%; padding: 12px 38px 12px 14px; border: 1.5px solid var(--border-color); border-radius: 12px; font-size: 1.05rem; outline: none; background: var(--bg-dark); color: var(--text-main); }
        .input-wrapper::after { content: "€"; position: absolute; right: 16px; color: var(--text-muted); font-weight: bold; }
        
        .btn-calc { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-green), #5ba30f); color: var(--bg-dark); border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .result-box { margin-top: 24px; padding: 18px; background: #13243d; border-radius: 16px; border: 1px solid rgba(113, 190, 22, 0.3); }
        .result-box h3 { font-size: 0.75rem; color: var(--accent-green); text-transform: uppercase; margin-bottom: 6px; }
        .result-box .main-value { font-size: 1.8rem; font-weight: 800; color: #ffffff; }
        .result-box .sub-value { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        .alert-box { margin-top: 14px; padding: 10px 14px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.2); color: #fbbf24; border-radius: 10px; font-size: 0.8rem; display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>ERZ-com.net</h1>
        <p>Handyshops Olbernhau + Marienberg</p>
    </div>
    
    <input type="radio" id="radio-marge" name="tab-group" class="tab-radio" checked>
    <input type="radio" id="radio-preis" name="tab-group" class="tab-radio">

    <div class="tabs-nav">
        <label for="radio-marge" class="tab-label label-marge">Marge berechnen</label>
        <label for="radio-preis" class="tab-label label-preis">Preis kalkulieren</label>
    </div>

    <div class="content-panes">
        <!-- TAB 1: MARGE -->
        <div id="tab-marge" class="tab-content">
            <div class="input-group"><label>Brutto-Verkaufspreis</label><div class="input-wrapper"><input type="number" step="0.01" id="m-brutto-vk" value="0"></div></div>
            <div class="input-group"><label>Einkaufspreis (netto)</label><div class="input-wrapper"><input type="number" step="0.01" id="m-netto-ek" value="0"></div></div>
            <div class="input-group"><label>Provision (netto)</label><div class="input-wrapper"><input type="number" step="0.01" id="m-provision" value="0"></div></div>
            <div class="input-group"><label>NBA (netto)</label><div class="input-wrapper"><input type="number" step="0.01" id="m-nba" value="0"></div></div>
            <button class="btn-calc" onclick="kalkuliereMarge()">Gewinn berechnen</button>
            <div class="result-box">
                <h3>Ihr Nettogewinn</h3>
                <div class="main-value" id="val-marge-gewinn">0,00 €</div>
                <div class="sub-value" id="val-marge-netto-vk">Netto-VK: 0,00 €</div>
            </div>
        </div>

        <!-- TAB 2: PREIS -->
        <div id="tab-preis" class="tab-content">
            <div class="input-group"><label>Einkaufspreis (netto)</label><div class="input-wrapper"><input type="number" step="0.01" id="p-netto-ek" value="0"></div></div>
            <div class="input-group"><label>Provision (netto)</label><div class="input-wrapper"><input type="number" step="0.01" id="p-provision" value="0"></div></div>
            <div class="input-group"><label>NBA (netto)</label><div class="input-wrapper"><input type="number" step="0.01" id="p-nba" value="0"></div></div>
            <div class="input-group"><label>Ziel-Nettogewinn</label><div class="input-wrapper"><input type="number" step="0.01" id="p-ziel-gewinn" value="0"></div></div>
            <button class="btn-calc" onclick="kalkulierePreis()">Verkaufspreis ermitteln</button>
            <div id="alert-preis" class="alert-box">🚨 Hinweis: Kosten gedeckt. Mindestpreis (1,00 €) angewendet.</div>
            <div class="result-box">
                <h3>Erforderlicher Brutto-VK</h3>
                <div class="main-value" id="val-preis-brutto">0,00 €</div>
                <div class="sub-value" id="val-preis-netto">Erforderlicher Netto-VK: 0,00 €</div>
            </div>
        </div>
    </div>
</div>

<script>
    const MWST = 19.0;

    function holeWert(id) {
        const val = document.getElementById(id).value;
        return parseFloat(val) || 0;
    }
    
    function formatEuro(w) { return w.toFixed(2).replace('.', ',') + " €"; }

    function kalkuliereMarge() {
        let bVk = holeWert('m-brutto-vk');
        let nEk = holeWert('m-netto-ek');
        let prov = holeWert('m-provision');
        let nba = holeWert('m-nba');
        
        let nVk = bVk / (1 + (MWST / 100));
        let gewinn = (nVk + prov + nba) - nEk;
        
        document.getElementById('val-marge-gewinn').innerText = formatEuro(gewinn);
        document.getElementById('val-marge-netto-vk').innerText = "Netto-VK: " + formatEuro(nVk);
    }

    function kalkulierePreis() {
        let nEk = holeWert('p-netto-ek');
        let prov = holeWert('p-provision');
        let nba = holeWert('p-nba');
        let ziel = holeWert('p-ziel-gewinn');
        
        let erfNettoVk = (nEk + ziel) - prov - nba;
        let minNettoVk = 1.00 / (1 + (MWST / 100));
        let bruttoFinal = 0;
        
        if (erfNettoVk <= minNettoVk) {
            bruttoFinal = 1.00;
            document.getElementById('alert-preis').style.display = 'block';
        } else {
            let bruttoUngewollt = erfNettoVk * (1 + (MWST / 100));
            let naechsterZehner = Math.ceil(bruttoUngewollt / 10.0) * 10.0;
            bruttoFinal = naechsterZehner - 0.10;
            if (bruttoFinal < bruttoUngewollt) { bruttoFinal = (naechsterZehner + 10.0) - 0.10; }
            document.getElementById('alert-preis').style.display = 'none';
        }
        
        document.getElementById('val-preis-brutto').innerText = formatEuro(bruttoFinal);
        document.getElementById('val-preis-netto').innerText = "Erforderlicher Netto-VK: " + formatEuro(bruttoFinal / (1 + (MWST / 100)));
    }
</script>
</body>
</html>
