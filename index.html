<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERZ-com Vertragsrechner</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        :root {
            --bg-dark: #070f1e;        /* Tiefes, modernes Dunkelblau-Schwarz */
            --card-bg: #0f1b2f;       /* Edles Dunkelblau für Kacheln */
            --primary: #1a4273;       /* Akzent-Blau */
            --accent-green: #71be16;  /* Das originale ERZ-com Grün */
            --text-main: #f1f5f9;     /* Klares Weiß für Texte */
            --text-muted: #94a3b8;    /* Sanftes Grau für Labels */
            --border-color: #1e293b;  /* Subtile Trennlinien */
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 16px;
        }

        .app-container { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 440px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
            overflow: hidden; 
            border: 1px solid var(--border-color);
            padding: 24px;
        }

        .header { 
            text-align: center; 
            margin-bottom: 24px; 
        }
        
        .header h1 { 
            font-size: 1.6rem; 
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        
        .header p { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Unsichtbare Radio-Buttons steuern die Tabs */
        .tab-radio { display: none; }
        
        /* Modernes Schieberegler-Design (Pill-Selector) */
        .tabs-nav { 
            display: flex; 
            background: var(--bg-dark); 
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            position: relative;
        }
        
        .tab-label { 
            flex: 1; 
            padding: 10px; 
            font-size: 0.9rem; 
            font-weight: 600; 
            color: var(--text-muted); 
            cursor: pointer; 
            text-align: center; 
            z-index: 2;
            transition: color 0.3s ease;
        }
        
        .tab-content { display: none; }
        
        /* Steuerungslogik via CSS */
        #radio-marge:checked ~ .tabs-nav .label-marge { color: var(--text-main); background: var(--card-bg); border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #radio-preis:checked ~ .tabs-nav .label-preis { color: var(--text-main); background: var(--card-bg); border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        #radio-marge:checked ~ .content-panes #tab-marge { display: block; }
        #radio-preis:checked ~ .content-panes #tab-preis { display: block; }

        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Futuristische Eingabefelder */
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper input, .input-wrapper select { 
            width: 100%; 
            padding: 12px 38px 12px 14px; 
            border: 1.5px solid var(--border-color); 
            border-radius: 12px; 
            font-size: 1.05rem; 
            outline: none; 
            background: var(--bg-dark); 
            color: var(--text-main);
            transition: all 0.25s ease;
            -webkit-appearance: none; 
            appearance: none; 
        }
        
        .input-wrapper input:focus, .input-wrapper select:focus { 
            border-color: var(--accent-green); 
            box-shadow: 0 0 0 3px rgba(113, 190, 22, 0.15);
        }
        
        .input-wrapper::after { content: "€"; position: absolute; right: 16px; color: var(--text-muted); font-weight: bold; pointer-events: none; }
        .input-wrapper.select-wrapper::after { content: "▼"; color: var(--text-muted); font-size: 0.75rem; right: 16px; }
        
        /* Moderner Aktions-Button */
        .btn-calc { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, var(--accent-green), #5ba30f); 
            color: var(--bg-dark); 
            border: none; 
            border-radius: 12px; 
            font-size: 1.05rem; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 10px; 
            box-shadow: 0 8px 20px rgba(113, 190, 22, 0.25);
            transition: all 0.2s ease;
        }
        .btn-calc:active { transform: scale(0.98); box-shadow: 0 4px 10px rgba(113, 190, 22, 0.2); }
        
        /* Stilvolle Dashboard-Ergebnisbox */
        .result-box { 
            margin-top: 24px; 
            padding: 18px; 
            background: linear-gradient(135deg, #13243d, #0f1b2f); 
            border-radius: 16px; 
            border: 1px solid rgba(113, 190, 22, 0.3);
            display: none; 
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box h3 { font-size: 0.75rem; color: var(--accent-green); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        .result-box .main-value { font-size: 1.8rem; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }
        .result-box .sub-value { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        
        /* Dezente Warnmeldung */
        .alert-box { 
            margin-top: 14px; 
            padding: 10px 14px; 
            background: rgba(245, 158, 11, 0.1); 
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #fbbf24; 
            border-radius: 10px; 
            font-size: 0.8rem; 
            display: none; 
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>ERZ-com.net</h1>
        <p>Vertragsrechner</p>
    </div>
    
    <input type="radio" id="radio-marge" name="tab-group" class="tab-radio" checked>
    <input type="radio" id="radio-preis" name="tab-group" class="tab-radio">

    <div class="tabs-nav">
        <label for="radio-marge" class="tab-label label-marge">Marge</label>
        <label for="radio-preis" class="tab-label label-preis">Preiskalkulation</label>
    </div>

    <div class="content-panes">
        <!-- TAB 1: MARGE -->
        <div id="tab-marge" class="tab-content">
            <div class="input-group"><label>Brutto-Verkaufspreis</label><div class="input-wrapper"><input type="text" inputmode="decimal" id="m-brutto-vk" placeholder="0,00"></div></div>
            <div class="input-group"><label>Einkaufspreis (netto)</label><div class="input-wrapper"><input type="text" inputmode="decimal" id="m-netto-ek" placeholder="0,00"></div></div>
            <div class="input-group"><label>Provision (netto)</label><div class="input-wrapper"><input type="text" inputmode="decimal" id="m-provision" placeholder="0,00"></div></div>
            <div class="input-group">
                <label>NBA (netto)</label>
                <div class="input-wrapper select-wrapper">
                    <select id="m-nba">
                        <option value="0">kein</option>
                        <option value="40">40 €</option>
                        <option value="80">80 €</option>
                    </select>
                </div>
            </div>
            <button class="btn-calc" onclick="kalkuliereMarge()">Gewinn berechnen</button>
            <div id="res-marge" class="result-box">
                <h3>Nettogewinn (Gesamtmarge)</h3>
                <div class="main-value" id="val-marge-gewinn">0,00 €</div>
                <div class="sub-value" id="val-marge-netto-vk">Netto-VK: 0,00 €</div>
            </div>
        </div>

        <!-- TAB 2: PREIS -->
        <div id="tab-preis" class="tab-content">
            <div class="input-group"><label>Einkaufspreis (netto)</label><div class="input-wrapper"><input type="text" inputmode="decimal" id="p-netto-ek" placeholder="0,00"></div></div>
            <div class="input-group"><label>Provision (netto)</label><div class="input-wrapper"><input type="text" inputmode="decimal" id="p-provision" placeholder="0,00"></div></div>
            <div class="input-group">
                <label>NBA (netto)</label>
                <div class="input-wrapper select-wrapper">
                    <select id="p-nba">
                        <option value="0">kein</option>
                        <option value="40">40 €</option>
                        <option value="80">80 €</option>
                    </select>
                </div>
            </div>
            <div class="input-group"><label>Ziel-Nettogewinn</label><div class="input-wrapper"><input type="text" inputmode="decimal" id="p-ziel-gewinn" placeholder="0,00"></div></div>
